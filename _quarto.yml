project:
  type: website
  output-dir: docs
  
website:
  page-navigation: true
  title: "Tianya HOU"
  site-url: https://github.com/kaokaohty
  repo-url: https://github.com/kaokaohty/kaokaohty.github.io
  
  page-footer:
    left: |
      [Tianya's Github](https://github.com/kaokaohty)<br>
    right: |
      Made with [Quarto](https://quarto.org/)<br>
    
  navbar: 
    search: true
    right: 
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Data Viz Gallery"
        href: gallery.qmd
      - text: "CV"
